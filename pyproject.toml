[project]
name = "kensho"
version = "0.1.0"
description = "Bilingual JA/EN enterprise-support RAG with claim-level citation verification"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "qdrant-client>=1.9", "numpy>=1.26", "rank-bm25>=0.2"]

[project.optional-dependencies]
corpus = ["transformers>=4.40"]
# embed.py / llm.py import these lazily, only when the real (non-fake/echo)
# backend is actually requested — so they stay optional, unlike
# qdrant-client, numpy, and rank-bm25 above, which are imported
# unconditionally.
retrieval = ["sentence-transformers>=3.0"]
generation = ["groq>=1.0"]
# sudachipy ships its own dictionary in the wheel, so — unlike everything
# under `retrieval` above — it needs no network at run time and is safe to
# install and genuinely exercise in CI. Still optional because segment.py's
# CharBigramSegmenter fallback means kensho works without it.
sparse = ["sudachipy>=0.6", "sudachidict_core"]
# NLIVerifier needs transformers (already listed under corpus) plus torch
# for inference — torch isn't pulled in by anything else on its own.
verify = ["transformers>=4.40", "torch>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]
# data/ holds the vendored Kubernetes clone; it is corpus input, not our code.
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
